sonar.projectKey=gabrielsilva611_PrazoCertoo
sonar.organization=gabrielsilva611

# Relatorios de cobertura gerados pelo Jest (backend) e Vitest (frontend) no CI.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Mesmos arquivos que o Jest (collectCoverageFrom) e o Vitest (coverage.exclude)
# ja deixam de fora da cobertura: sem isso o Sonar conta esses arquivos como
# 0% coberto (em vez de "nao se aplica"), derrubando a media artificialmente.
sonar.coverage.exclusions=backend/HttpTrigger/**,backend/jest.config.js,backend/prisma.config.ts,backend/tests/**,frontend/src/main.tsx,frontend/src/vite-env.d.ts,frontend/src/types.ts,frontend/src/tests/**
