name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Configura banco de teste
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL_TEST }}" >> .env.test
          echo "JWT_SECRET=ci-test-secret" >> .env.test

      - run: ./node_modules/.bin/prisma generate

      # Usa a conexão direta (sem pooler) só pra migration: a sessão do
      # pooler do Neon não fecha de forma confiável quando o processo do
      # Prisma termina, deixando o advisory lock preso pro próximo run.
      - name: Aplica migrations pendentes no banco de teste
        run: ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST_DIRECT }}

      - run: npm test

  frontend:
    name: Frontend (tipos + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
