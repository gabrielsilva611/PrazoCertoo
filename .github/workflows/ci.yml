name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm install -g --ignore-scripts npm@11.6.2
      - run: npm ci --ignore-scripts

      - name: Configura banco de teste
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL_TEST }}" >> .env.test
          echo "JWT_SECRET=ci-test-secret" >> .env.test

      - run: ./node_modules/.bin/prisma generate

      # Usa a conexão direta (sem pooler) só pra migration: a sessão do
      # pooler do Neon não fecha de forma confiável quando o processo do
      # Prisma termina, deixando o advisory lock preso pro próximo run.
      - name: Aplica migrations pendentes no banco de teste
        run: ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST_DIRECT }}

      - run: npm run test:coverage

      - name: Guarda o relatorio de cobertura pro job do SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info

  frontend:
    name: Frontend (tipos + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

      - name: Guarda o relatorio de cobertura pro job do SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info

  sonarcloud:
    name: SonarCloud Code Analysis
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage

      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
