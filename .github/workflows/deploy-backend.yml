name: Deploy Backend (Azure Functions)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build e Deploy
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g --ignore-scripts npm@11.6.2
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/prisma generate

      # Sem --ignore-scripts de propósito: o postinstall desse pacote (lib/install.js)
      # é quem baixa o binário real do "func" — pulá-lo deixa o comando inexistente.
      - name: Instala Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4.16.1 --unsafe-perm true

      - name: Login na Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publica no Azure Functions
        run: func azure functionapp publish prazocerto-backend-flex --javascript
